# Merges a pull request into main, with a merge commit, once the quality gate has passed
# on its head commit, so a pull request lands without a human. It merges only a pull
# request whose every file is one the gate judges rather than one that configures it:
# Python under hyprmuse/ or tests/, and Markdown at the root or under docs/; never a
# conftest.py, nor a name holding a control character (a tab or a newline splits the
# lists the checks below compare), nor a symlink or submodule, which git diffs as its
# target's path or a commit id, so the gate never sees the code behind it. Anything else
# waits for a human, since CI judged the pull request by its own copy of it: CI's files,
# pytest's, coverage's and ruff's configuration wherever it sits, uv.lock, a
# .gitattributes that hides lines from git diff, and any file named later.
# Also held: drafts; pull requests labelled no-automerge, from forks or into another
# branch; and one whose files or head tree cannot all be listed.
#
# GitHub runs this from main's copy for status events, so a pull request cannot change
# these rules for itself. It trusts a success only from Jenkins's GitHub App
# (davidsiegl-jenkins[bot]), which the agents' own token cannot post as.
#
# It merges with the workflow's own token. A merge made with it starts no workflow for
# the push to main; a release-on-merge workflow would need a personal token instead.
name: Auto-merge

on:
  status

permissions: {}

jobs:
  merge:
    if: >-
      github.event.state == 'success' &&
      github.event.context == 'continuous-integration/jenkins/pr-head' &&
      github.event.sender.login == 'davidsiegl-jenkins[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # No concurrency group: one would cancel a queued run when a third arrives, leaving a
    # passed pull request unmerged. gh pr merge --match-head-commit makes parallel runs safe.
    steps:
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.event.sha }}
        run: |
          # 1 when a pull request may have passed but was not merged: a merge or a lookup failed.
          failed=0
          # Every open pull request whose head is the commit that passed.
          if ! prs=$(gh api "repos/$GH_REPO/commits/$SHA/pulls" --jq '.[] | select(.state == "open") | .number'); then
            echo "::error::could not list the pull requests at $SHA"
            exit 1
          fi
          for pr in $prs; do
            if ! fields=$(gh pr view "$pr" \
              --json headRefOid,headRefName,baseRefName,isDraft,isCrossRepository,labels,changedFiles \
              --jq '[.headRefOid, .headRefName, .baseRefName, .isDraft, .isCrossRepository,
                     any(.labels[]; .name == "no-automerge"), .changedFiles] | @tsv'); then
              echo "::error::#$pr: could not read it"
              failed=1
              continue
            fi
            IFS=$'\t' read -r head branch base draft fork held changed <<<"$fields"
            if [ "$head" != "$SHA" ]; then
              echo "#$pr: its head moved on from $SHA; that commit's own check decides"
              continue
            elif [ "$base" != main ] || [ "$draft" = true ] || [ "$fork" = true ] || [ "$held" = true ]; then
              echo "#$pr: held (base $base, draft $draft, fork $fork, no-automerge $held)"
              continue
            fi
            # Both sides of a rename: moving a file out of .github/ changes .github/ too. The
            # files endpoint lists at most 3000 files, so a larger pull request is held. A name
            # with a control character fails the query here, before $(...) and the line-based
            # checks below can strip or split it.
            if ! paths=$(gh api --paginate "repos/$GH_REPO/pulls/$pr/files" \
              --jq '.[] | .filename, (.previous_filename // empty)
                    | if test("\\p{Cc}") then error("a file name holds a control character") else . end') ||
              ((changed >= 3000)); then
              echo "#$pr: could not list all its files, or one's name holds a control character; held for a human"
            elif grep -vqE '^(hyprmuse|tests)/.*\.py$|^(docs/.*)?[^/]*\.md$' <<<"$paths" ||
              grep -qE '(^|/)conftest\.py$' <<<"$paths"; then
              echo "#$pr: changes files outside what auto-merge lands; held for a human"
            # The files endpoint has no mode, so the head commit's tree gives it: a listed path
            # held there as anything but a regular file is a symlink or submodule. A path absent
            # from the tree was deleted or renamed away. A truncated tree cannot be checked.
            elif ! modes=$(gh api "repos/$GH_REPO/git/trees/$SHA?recursive=1" \
              --jq 'if .truncated then error("tree truncated") else .tree[] | "\(.mode)\t\(.path)" end') ||
              awk 'NR == FNR { listed[$0]; next }
                { tab = index($0, "\t") }
                substr($0, tab + 1) in listed && substr($0, 1, tab - 1) !~ /^100(644|755)$/ { found = 1 }
                END { exit !found }' <(printf '%s\n' "$paths") - <<<"$modes"; then
              echo "#$pr: has a symlink or submodule, or its tree could not be read; held for a human"
            elif ! gh pr merge "$pr" --merge --match-head-commit "$SHA"; then
              echo "::error::#$pr: merge failed"
              failed=1
            else
              echo "#$pr: merged"
              gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" ||
                echo "::warning::#$pr: merged, but its branch $branch was not deleted"
            fi
          done
          exit "$failed"
