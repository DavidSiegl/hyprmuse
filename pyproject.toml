[project]
name = "hyprmuse"
version = "0.3.2"
description = "Random quotes from musicians, authors and poets for hyprlock"
readme = "README.md"
license = "MIT"
authors = [{ name = "David Siegl" }]
keywords = ["hyprland", "hyprlock", "quotes", "lockscreen"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Desktop Environment",
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "lxml>=6.0.2",
    "requests>=2.32.5",
]

[project.scripts]
hyprmuse = "hyprmuse.cli:main"

[project.urls]
Homepage = "https://github.com/DavidSiegl/hyprmuse"
Issues = "https://github.com/DavidSiegl/hyprmuse/issues"
Releases = "https://github.com/DavidSiegl/hyprmuse/releases"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "mutmut>=3.8.0",
    "mypy>=2.4.0",
    "pymarkdownlnt>=0.9.41",
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

# The rules scripts/gate judges a change by. Only findings on lines the change adds
# since its base count, so what is already on main does not block. Taken from
# octoflow-ai, whose docs/quality-gate.md says what each check is for.

[tool.ruff.lint]
# The defaults, plus bugbear, simplifications, pyupgrade, bandit's security checks,
# complexity, pylint's errors and warnings, W505 for comments and docstrings, and a
# docstring on every public module, class, method and function (presence only).
extend-select = ["B", "SIM", "UP", "S", "C90", "PLE", "PLW", "W505", "D100", "D101", "D102", "D103", "D104", "D106"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# assert is how pytest checks; a test documents itself by its name.
"tests/**" = ["S101", "S105", "S106", "S108", "C901", "D1"]

[tool.mypy]
files = ["hyprmuse"]

[tool.mutmut]
# What the gate's surviving-mutants check mutates (only the functions a change edits)
# and which tests it runs against them.
source_paths = ["hyprmuse/"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.pymarkdown]
# Prose is not wrapped to a fixed width.
plugins.md013.enabled = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyprmuse"]

# What builds and tests the package, and nothing of the repo's tooling; hatchling adds
# pyproject.toml, PKG-INFO and .gitignore itself.
[tool.hatch.build.targets.sdist]
include = ["/hyprmuse/", "/tests/", "/README.md", "/LICENSE"]
